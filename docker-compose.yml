version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: havenkeep-postgres
    restart: always
    environment:
      POSTGRES_DB: havenkeep_db
      POSTGRES_USER: havenkeep_user
      POSTGRES_PASSWORD: havenkeep_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havenkeep_user -d havenkeep_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: havenkeep-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: havenkeep-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://havenkeep_user:havenkeep_password@postgres:5432/havenkeep_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: havenkeep-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      - backend

volumes:
  postgres_data:
